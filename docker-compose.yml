# BalloonsBuzz production stack. The database and photo storage are Supabase (hosted), so
# this runs only the app: migrate (one-shot), api, worker, web (nginx + dashboard), backup.
#
#   docker compose up -d --build          # first deploy / every update
#   docker compose run --rm backup backup  # take a backup now
#   docker compose run --rm backup drill   # restore drill (temporary database, dropped after)
#
# Every secret comes from .env (never from this file). Only `web` publishes a port, and only on
# 127.0.0.1: the HTTPS proxy on the host (Caddy, see docs/DEPLOY.md) is the one public door.
# For a database on this machine instead of Supabase, see docker-compose.db.yml.
name: balloonsbuzz

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5", compress: "true" }   # log rotation: ≤ 50 MB per service

x-app: &app
  build: { context: ., dockerfile: backend/Dockerfile }
  image: balloonsbuzz-api
  env_file: .env
  environment:
    NODE_ENV: production
    # Caddy on the host -> nginx in `web` -> api = 2 proxies. Wrong values break per-IP rate limits.
    TRUST_PROXY: ${TRUST_PROXY:-2}
  logging: *logging
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["sh", "-c", "node db/migrate.js up && node db/migrate.js seed"]
    restart: "no"

  api:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *app
    command: ["node", "backend/src/worker.js"]
    # the API image's healthcheck calls :4000, which the worker doesn't serve; the worker
    # proves it is alive through /api/health (heartbeat) instead
    healthcheck: { disable: true }
    stop_grace_period: 45s    # let running jobs (sends, AI replies) finish on deploys
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: balloonsbuzz-web
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_PORT:-8080}:80"]
    logging: *logging
    depends_on:
      api: { condition: service_healthy }

  backup:
    build: { context: ., dockerfile: ops/backup/Dockerfile }
    image: balloonsbuzz-backup
    env_file: .env
    environment:
      TZ: UTC
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    logging: *logging
    restart: unless-stopped
